name: Lola Daily Reminders

on:
  schedule:
    # ده مجرد "شبكة أمان" احتياطية لو الموقع الخارجي (cron-job.org) وقف لأي سبب.
    # المصدر الأساسي والأدق للتوقيت هو workflow_dispatch من برّه (خطوة منفصلة).
    - cron: '0 * * * *' # كل ساعة بالظبط، احتياطي بس
  workflow_dispatch: {} # ده اللي هيتنده من cron-job.org كل 5 دقايق، وأيضًا بيدّيك زرار "Run workflow" يدوي

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifications
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node send-notifications.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
